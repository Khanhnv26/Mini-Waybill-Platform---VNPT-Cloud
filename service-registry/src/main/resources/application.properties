spring.application.name=service-registry

# Mặc định: Chạy 1 node đơn lẻ
server.port=8761
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ==========================================
# Cấu hình Eureka HA: Node 1 (Cổng 8761)
# ==========================================
---
spring.config.activate.on-profile=peer1
server.port=8761
eureka.instance.hostname=localhost
eureka.instance.instance-id=service-registry:8761
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

# ==========================================
# Cấu hình Eureka HA: Node 2 (Cổng 8762)
# ==========================================
---
spring.config.activate.on-profile=peer2
server.port=8762
eureka.instance.hostname=localhost
eureka.instance.instance-id=service-registry:8762
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
