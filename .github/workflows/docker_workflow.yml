name: docker_workflow.yml
on:
  pull_request:
    branches: [main, business]
  push:
    branches:
      - main
      - business
  workflow_dispatch:
    inputs:
      service:
        description: 'Dịch vụ cần build (bỏ trống để tự động nhận diện thay đổi, nhập "all" để build tất cả, hoặc nhập tên dịch vụ cụ thể)'
        required: false
        default: ''
      promote:
        description: 'Cập nhật GitOps sau khi staging, migration và rollback đã được duyệt'
        type: boolean
        required: false
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Check templates, test frontend and build CSS
        run: npm run verify --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify isolated backend tests (infrastructure contexts run on staging)
        run: mvn --batch-mode --no-transfer-progress verify '-Dtest=!*ApplicationTests' '-Dsurefire.failIfNoSpecifiedTests=false'
      - uses: azure/setup-kubectl@v4
      - name: Render application and Minikube manifests
        run: |
          kubectl kustomize k8s/02-services > /tmp/waybill-production.yaml
          kubectl kustomize k8s > /tmp/waybill-local.yaml

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-services: ${{ steps.eval.outputs.backend_services }}
      frontend-changed: ${{ steps.eval.outputs.frontend_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            customer-service:
              - 'customer-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            shipment-service:
              - 'shipment-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            routing-service:
              - 'routing-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            tracking-service:
              - 'tracking-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            notification-service:
              - 'notification-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            audit-service:
              - 'audit-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            shipper-service:
              - 'shipper-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            report-service:
              - 'report-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            support-service:
              - 'support-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            rating-service:
              - 'rating-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            payment-service:
              - 'payment-service/**'
              - 'pom.xml'
              - 'shared-events/**'
            service-registry:
              - 'service-registry/**'
              - 'pom.xml'
            api-gateway:
              - 'api-gateway/**'
              - 'pom.xml'
            frontend:
              - 'frontend/**'
              - 'server.js'

      - name: Evaluate target services
        id: eval
        env:
          MANUAL_SERVICE: ${{ github.event.inputs.service }}
        run: |
          EVENT="${{ github.event_name }}"
          ALL_BACKEND='["auth-service","customer-service","shipment-service","routing-service","tracking-service","notification-service","audit-service","shipper-service","report-service","support-service","rating-service","payment-service","service-registry","api-gateway"]'

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$MANUAL_SERVICE" ]; then
            if [ "$MANUAL_SERVICE" = "all" ]; then
              echo "backend_services=$ALL_BACKEND" >> $GITHUB_OUTPUT
              echo "frontend_changed=true" >> $GITHUB_OUTPUT
            elif [ "$MANUAL_SERVICE" = "frontend" ]; then
              echo "backend_services=[]" >> $GITHUB_OUTPUT
              echo "frontend_changed=true" >> $GITHUB_OUTPUT
            elif echo "$ALL_BACKEND" | jq -e --arg service "$MANUAL_SERVICE" 'index($service) != null' >/dev/null; then
              echo "backend_services=[\"$MANUAL_SERVICE\"]" >> $GITHUB_OUTPUT
              echo "frontend_changed=false" >> $GITHUB_OUTPUT
            else
              echo "Unknown service" >&2
              exit 1
            fi
          else
            CHANGES='${{ steps.filter.outputs.changes }}'
            BACKEND=$(echo "$CHANGES" | jq -c '[.[] | select(. != "frontend")]')
            echo "backend_services=$BACKEND" >> $GITHUB_OUTPUT
            echo "frontend_changed=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: [detect-changes, validate]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.backend-services != '[]' && needs.detect-changes.outputs.backend-services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.backend-services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build JAR with Maven
        run: |
          mvn --batch-mode --no-transfer-progress package -pl ${{ matrix.service }} -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    needs: [detect-changes, validate]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.frontend-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build:css --prefix frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-manifests:
    needs: [detect-changes, validate, build-and-push, build-and-push-frontend]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.promote == true &&
      needs.validate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.build-and-push-frontend.result == 'success' || needs.build-and-push-frontend.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push-frontend.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce release gate before editing manifests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE: ${{ inputs.promote }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          BACKEND_RESULT: ${{ needs.build-and-push.result }}
          FRONTEND_RESULT: ${{ needs.build-and-push-frontend.result }}
        run: node .github/scripts/check-release.cjs

      - name: Update K8s Manifest Image Tags
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          COMMIT_SHA="${{ github.sha }}"
          SERVICES='${{ needs.detect-changes.outputs.backend-services }}'
          FRONTEND_CHANGED="${{ needs.detect-changes.outputs.frontend-changed }}"
          
          # 1. Cập nhật các backend services nếu có thay đổi
          if [ -n "$SERVICES" ] && [ "$SERVICES" != "[]" ]; then
            for svc in $(echo "$SERVICES" | jq -r '.[]'); do
              FILE="k8s/02-services/${svc}.yaml"
              if [ -f "$FILE" ]; then
                echo "Cập nhật $FILE -> tag $COMMIT_SHA"
                sed -i -E "s|image: .*/${svc}:.*|image: ${DOCKER_USER}/${svc}:${COMMIT_SHA}|g" "$FILE"
                git add "$FILE"
              fi
            done
          fi

          # 2. Cập nhật frontend nếu có thay đổi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            FRONTEND_FILE="k8s/02-services/frontend.yaml"
            if [ -f "$FRONTEND_FILE" ]; then
              echo "Cập nhật $FRONTEND_FILE -> tag $COMMIT_SHA"
              sed -i -E "s|image: .*/frontend:.*|image: ${DOCKER_USER}/frontend:${COMMIT_SHA}|g" "$FRONTEND_FILE"
              git add "$FRONTEND_FILE"
            fi
          fi

          # 3. Commit và push nếu có thay đổi trong k8s/
          if git diff --staged --quiet; then
            echo "Không có thay đổi manifest cần commit."
          else
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(gitops): update image tags to ${COMMIT_SHA} [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  notify-telegram:
    needs: [detect-changes, build-and-push, build-and-push-frontend, update-gitops-manifests]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Thông báo CI/CD & GitOps</b>
            <b>Dự án:</b> Mini-Waybill Platform
            <b>Developer:</b> ${{ github.actor }}
            <b>Nhánh:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>

            <b>Backend thay đổi:</b>
            <code>${{ needs.detect-changes.outputs.backend-services != '[]' && needs.detect-changes.outputs.backend-services || 'Không có (Skipped)' }}</code>
            <b>Frontend thay đổi:</b>
            <code>${{ needs.detect-changes.outputs.frontend-changed == 'true' && 'frontend' || 'Không có (Skipped)' }}</code>

            <b>Trạng thái Backend:</b> <b>${{ needs.build-and-push.result }}</b>
            <b>Trạng thái Frontend:</b> <b>${{ needs.build-and-push-frontend.result }}</b>
            <b>Trạng thái GitOps Manifest:</b> <b>${{ needs.update-gitops-manifests.result }}</b>

            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Xem chi tiết trên GitHub</a>
