name: docker_workflow.yml
on:
  push:
    branches:
      - main
      - business
  workflow_dispatch:
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
        service-changed: ${{steps.filter.outputs.changes}}
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Detect Changed Services
          uses: dorny/paths-filter@v3
          id: filter
          with:
            base: ${{ github.ref_name }}
            filters: |
              auth-service:
                - 'auth-service/**'
                - 'shared-events/**'
              customer-service:
                - 'customer-service/**'
                - 'shared-events/**'
              shipment-service:
                - 'shipment-service/**'
                - 'shared-events/**'
              routing-service:
                - 'routing-service/**'
                - 'shared-events/**'
              tracking-service:
                - 'tracking-service/**'
                - 'shared-events/**'
              notification-service:
                - 'notification-service/**'
                - 'shared-events/**'
              audit-service:
                - 'audit-service/**'
                - 'shared-events/**'
              shipper-service:
                - 'shipper-service/**'
                - 'shared-events/**'
              report-service:
                - 'report-service/**'
                - 'shared-events/**'
              service-registry:
                - 'service-registry/**'
              api-gateway:
                - 'api-gateway/**'

  build-and-push:
    needs: detect-changes

    if: ${{needs.detect-changes.outputs.service-changed != '[]' && needs.detect-changes.outputs.service-changed != ''}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.service-changed) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Build JAR with Maven
        run: |
          mvn clean package -pl ${{ matrix.service }} -am -DskipTests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  notify-telegram:
    needs: [detect-changes, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Thông báo</b>
            <b>Dự án:</b> Mini-Waybill Platform
            <b>Developer:</b> ${{ github.actor }}
            <b>Nhánh:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>

            <b>Dịch vụ thay đổi:</b>
            <code>${{ needs.detect-changes.outputs.service-changed || 'Không có (Skipped)' }}</code>

            <b>Trạng thái Build:</b> <b>${{ needs.build-and-push.result }}</b>

            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Xem chi tiết trên GitHub</a>


