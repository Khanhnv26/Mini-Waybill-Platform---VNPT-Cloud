name: docker_workflow.yml
on:
  push:
    branches:
      - main
      - business
    paths:
      - 'customer-service/**'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  build-and-push-customer:
    name: Build and Push Customer Service
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
              distribution: 'temurin'
              java-version: '21'
              cache: maven
        - name: Build JAR with Maven
          run: | 
            mvn clean package -pl customer-service -am -DskipTests
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v5
          with:
              context: ./customer-service
              file: ./customer-service/Dockerfile
              push: true
              tags: | 
                ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/customer-service:1.0
              cache-from: type=gha
              cache-to: type=gha,mode=max
              

