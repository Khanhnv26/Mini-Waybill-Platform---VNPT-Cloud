name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (ví dụ: v3.2.2)'
        required: false
        default: 'v3.2.2'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Waybill Platform Desktop ${{ github.event.inputs.tag || github.ref_name }} (Bản Cập Nhật Giao Diện & SSO)'
          releaseBody: |
            ### Bản phát hành ${{ github.event.inputs.tag || github.ref_name }} - Nâng cấp Giao diện & Trải nghiệm SSO Desktop
            - **Cổng Bàn Giao SSO Hiện Đại**: Thiết kế lại toàn bộ màn hình xác thực đăng nhập Desktop với animation kép đồng bộ 750ms giữa thanh tải và lộ trình xe tải Waybill Express tăng tốc về đích.
            - **Hỗ Trợ Toàn Diện Chế Độ Sáng & Tối (Day / Night Mode)**: Bầu trời chuyển dịch thông minh giữa Mặt Trời phát sáng ban ngày và Mặt Trăng lưỡi liềm + chòm sao nhấp nháy ban đêm, tích hợp nút chuyển đổi nhanh trên thanh tiêu đề.
            - **Chuẩn Hóa Bộ Nhận Diện Thương Hiệu 100% SVG**: Thay thế icon 3 lớp bằng Logo Bưu chính VNPT Waybill chính thức (Địa cầu 3D với vòng quỹ đạo vệ tinh và vệt sáng phản chiếu), loại bỏ toàn bộ badge rườm rà và emoji.
            - **Tối Ưu Hóa Bộ Cài Đặt Desktop**: Đóng gói bundle web assets offline mới nhất, hỗ trợ kiểm tra cập nhật tự động (Auto-Updater) và tương thích hoàn hảo với luồng Google OAuth Cloud.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
