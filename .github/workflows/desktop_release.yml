name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (ví dụ: v3.2)'
        required: false
        default: 'v3.2'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Waybill Platform Desktop ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ### Cập nhật phiên bản v3.2
            - Tích hợp đăng nhập Google an toàn qua trình duyệt hệ thống (RFC 8252).
            - Tự động đồng bộ phiên đăng nhập giữa Trình duyệt và Desktop App.
            - Khắc phục triệt để lỗi hiển thị màn hình trống và tối ưu hiệu năng.
          releaseDraft: false
          prerelease: false
