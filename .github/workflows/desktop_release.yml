name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*' # Chạy khi tạo tag mới như v1.0.0, v1.0.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (ví dụ: v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Waybill Platform Desktop ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Phiên bản cài đặt Desktop chính thức cho nhân viên quầy bưu cục.'
          releaseDraft: false
          prerelease: false
