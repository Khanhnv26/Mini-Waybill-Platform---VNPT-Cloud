name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (ví dụ: v3.2)'
        required: false
        default: 'v3.2.1'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Waybill Platform Desktop ${{ github.event.inputs.tag || github.ref_name }} (Bản Vá Lỗi)'
          releaseBody: |
            ### Bản vá lỗi ${{ github.event.inputs.tag || github.ref_name }}
            - Khắc phục lỗi mở trình duyệt nhầm localhost:3000 khi đăng nhập Google trên Desktop.
            - Tự động kết nối đúng cổng dịch vụ Cloud: https://waybill-express.japaneast.cloudapp.azure.com.
            - Sửa lỗi từ chối truy cập (403 Forbidden) và tối ưu hóa luồng xác thực Google OAuth.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
