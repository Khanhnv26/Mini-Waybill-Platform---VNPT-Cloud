name: mini-waybill-platform

services:
  kafka-1:
    image: apache/kafka:latest
    container_name: waybill-kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_KRAFT_CLUSTER_ID: "4L622nShTUiBenVKWIRCkg"
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    restart: always

  kafka-2:
    image: apache/kafka:latest
    container_name: waybill-kafka-2
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_KRAFT_CLUSTER_ID: "4L622nShTUiBenVKWIRCkg"
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    restart: always

  kafka-3:
    image: apache/kafka:latest
    container_name: waybill-kafka-3
    ports:
      - "127.0.0.1:9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_KRAFT_CLUSTER_ID: "4L622nShTUiBenVKWIRCkg"
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: waybill-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: waybill-ha-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: waybill-jaeger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:9411:9411"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    restart: always
  frontend-1:
    image: khanhnv26/frontend:1.0
    container_name: waybill-frontend-1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
    command: ["node", "server.js", "3000"]
    restart: always

  frontend-2:
    image: khanhnv26/frontend:1.0
    container_name: waybill-frontend-2
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
    command: ["node", "server.js", "3001"]
    restart: always

  nginx-gateway-lb:
    image: nginx:alpine
    container_name: waybill-nginx-gateway-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - frontend-1
      - frontend-2
      - notification-service
    restart: always

  redis:
      image: redis:alpine
      container_name: redis
      ports:
        - "127.0.0.1:6379:6379"
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
      restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mini-waybill-rabbitmq
    ports:
        - "127.0.0.1:5672:5672"
        - "127.0.0.1:15672:15672"
    environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    restart: always

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: waybill-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:?Set MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always

  sqlserver-replica:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: waybill-sqlserver-replica
    ports:
      - "127.0.0.1:2433:1433"
    environment:
      SA_PASSWORD: "${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}"
      ACCEPT_EULA: "Y"
    restart: always

  rating-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        for attempt in {1..60}; do
          if /opt/mssql-tools18/bin/sqlcmd -S sqlserver-replica -U sa -P "$$SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver-replica -U sa -P "$$SA_PASSWORD" -C -b -Q "IF DB_ID(N'rating_db') IS NULL CREATE DATABASE [rating_db]; IF DB_ID(N'payment_db') IS NULL CREATE DATABASE [payment_db];"
    environment:
      SA_PASSWORD: "${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}"
    depends_on:
      - sqlserver-replica
    restart: "no"

  eureka-peer1:
    image: khanhnv26/service-registry:1.0
    container_name: waybill-eureka-peer1
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=eureka-peer1
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer2:8762/eureka/
    restart: always

  eureka-peer2:
    image: khanhnv26/service-registry:1.0
    container_name: waybill-eureka-peer2
    ports:
      - "127.0.0.1:8762:8762"
    environment:
      - SERVER_PORT=8762
      - EUREKA_INSTANCE_HOSTNAME=eureka-peer2
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/
    restart: always

  api-gateway-1:
    image: khanhnv26/api-gateway:1.0
    container_name: waybill-api-gateway-1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - TRUSTED_PROXY_REGEX=172\.(1[6-9]|2[0-9]|3[0-1])\..*
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - eureka-peer1
      - eureka-peer2
      - redis
    restart: always

  api-gateway-2:
    image: khanhnv26/api-gateway:1.0
    container_name: waybill-api-gateway-2
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - SERVER_PORT=8088
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - TRUSTED_PROXY_REGEX=172\.(1[6-9]|2[0-9]|3[0-1])\..*
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - eureka-peer1
      - eureka-peer2
      - redis
    restart: always

  auth-service:
    image: khanhnv26/auth-service:1.0
    container_name: waybill-auth-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-peer1
      - eureka-peer2
      - redis
      - sqlserver-replica
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  customer-service:
    image: khanhnv26/customer-service:1.0
    container_name: waybill-customer-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=customer_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
    restart: always

  shipment-service:
    image: khanhnv26/shipment-service:1.0
    container_name: waybill-shipment-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=shipment_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  routing-service:
    image: khanhnv26/routing-service:1.0
    container_name: waybill-routing-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=routing_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
      - redis
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  tracking-service:
    image: khanhnv26/tracking-service:1.0
    container_name: waybill-tracking-service-1
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_PRIMARY_JDBC_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_PRIMARY_USERNAME=waybill_app
      - SPRING_DATASOURCE_PRIMARY_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}

      - SPRING_DATASOURCE_REPLICA_JDBC_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_REPLICA_USERNAME=waybill_app
      - SPRING_DATASOURCE_REPLICA_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}

      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      - sqlserver-replica
      - redis
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  tracking-service-2:
    image: khanhnv26/tracking-service:1.0
    container_name: waybill-tracking-service-2
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - SERVER_PORT=8094
      - SPRING_DATASOURCE_PRIMARY_JDBC_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_PRIMARY_USERNAME=waybill_app
      - SPRING_DATASOURCE_PRIMARY_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}

      - SPRING_DATASOURCE_REPLICA_JDBC_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_REPLICA_USERNAME=waybill_app
      - SPRING_DATASOURCE_REPLICA_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}

      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      - sqlserver-replica
      - redis
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  notification-service:
    image: khanhnv26/notification-service:1.0
    container_name: waybill-notification-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=notification_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - sqlserver-replica
      - redis
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  audit-service:
    image: khanhnv26/audit-service:1.0
    container_name: waybill-audit-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=audit_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  shipper-service:
    image: khanhnv26/shipper-service:1.0
    container_name: waybill-shipper-service
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=shipper_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  report-service:
    image: khanhnv26/report-service:1.0
    container_name: waybill-report-service
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=report_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
      - SPRING_DATASOURCE_USERNAME=waybill_app
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-peer1:8761/eureka/,http://eureka-peer2:8762/eureka/
    depends_on:
      - sqlserver-replica
      - eureka-peer1
      - eureka-peer2
      - kafka-1
      - kafka-2
      - kafka-3
    restart: always

  # support_db phải được tạo sẵn trên SQL Server. Flyway chỉ tạo bảng, không tạo database.
  support-service:
    image: khanhnv26/support-service:1.0
    container_name: waybill-support-service
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:?Set RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver-replica:1433;databaseName=support_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=waybill_app
