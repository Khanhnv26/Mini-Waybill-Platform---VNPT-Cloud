spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/customers,/api/customers/**

spring.cloud.gateway.server.webmvc.routes[1].id=shipment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://shipment-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/shipments,/api/shipments/**

spring.cloud.gateway.server.webmvc.routes[2].id=tracking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://tracking-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tracking,/api/tracking/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications,/api/notifications/**

spring.cloud.gateway.server.webmvc.routes[4].id=audit-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://audit-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/audits,/api/audits/**

