events {
 worker_connections 1024;
}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend_cluster {
        server frontend-1:3000 max_fails=3 fail_timeout=5s;
        server frontend-2:3001 max_fails=3 fail_timeout=5s;
    }




    upstream gateway_cluster {
        server api-gateway-1:8080 max_fails=3 fail_timeout=5s;
        server api-gateway-2:8088 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;


        error_page 403 /error.html?code=403;
        error_page 404 /error.html?code=404;
        error_page 500 /error.html?code=500;
        error_page 502 /error.html?code=502;
        error_page 503 /error.html?code=503;


        location = /error.html {
            root /usr/share/nginx/html;
        }

        location /api/notifications/ws {
            proxy_pass http://notification-service:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502;
            proxy_intercept_errors on;
        }
    }
}
