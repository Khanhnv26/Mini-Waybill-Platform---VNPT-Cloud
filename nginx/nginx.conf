events {
    worker_connections 1024;
}

http {
    upstream waybill_gateway_cluster {
        # Cân bằng tải Round-Robin giữa 2 instance API Gateway
        server host.docker.internal:8080 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8088 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://waybill_gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tự động failover nếu một Gateway bị sập
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
