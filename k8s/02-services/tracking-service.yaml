apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: waybill
  labels:
    app: tracking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
        - name: tracking-service
          image: khanhnv26/tracking-service:ca6e9899bb493782c7be311bea126d061767f27d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx200m -XX:+UseSerialGC"
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATASOURCE_PRIMARY_JDBC_URL
              value: "jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;"
            - name: SPRING_DATASOURCE_PRIMARY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-user
            - name: SPRING_DATASOURCE_PRIMARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
            - name: SPRING_DATASOURCE_REPLICA_JDBC_URL
              value: "jdbc:sqlserver://sqlserver-replica:1433;databaseName=tracking_db;encrypt=true;trustServerCertificate=true;"
            - name: SPRING_DATASOURCE_REPLICA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-user
            - name: SPRING_DATASOURCE_REPLICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-peer1:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_INSTANCE_ID
              value: "${HOSTNAME}:${server.port}"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: redis-password
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: tracking-service
  ports:
    - port: 8084
      targetPort: 8084
