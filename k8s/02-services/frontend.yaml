apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: waybill
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: khanhnv26/frontend:5d84d19b80f042fbae4334c4507d9b774c894b85
          imagePullPolicy: IfNotPresent
          command: ["node", "server.js", "3000"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GATEWAY_HOST
              value: "api-gateway"
            - name: GATEWAY_PORT
              value: "8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: direct
      port: 3000
      targetPort: 3000
