apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: waybill
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: khanhnv26/api-gateway:8305e36db0f983aee5794fd4e3736d8e63f752b9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx200m -XX:+UseSerialGC"
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-peer1:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_INSTANCE_ID
              value: "${HOSTNAME}:${server.port}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: jwt-secret
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: redis-password
                  optional: true
            - name: TRUSTED_PROXY_REGEX
              value: '10\.42\..*|127\.0\.0\.1|::1'
          resources:
            requests:
              memory: "128Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
