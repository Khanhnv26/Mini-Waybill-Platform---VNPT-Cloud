apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: waybill
  labels:
    app: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: khanhnv26/customer-service:1fd3c6e21f1e0d16986502764152725f1f1b2df5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx200m -XX:+UseSerialGC"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:sqlserver://sqlserver-replica:1433;databaseName=customer_db;encrypt=true;trustServerCertificate=true;"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-peer1:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_INSTANCE_ID
              value: "${HOSTNAME}:${server.port}"
          resources:
            requests:
              memory: "128Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - port: 8081
      targetPort: 8081
