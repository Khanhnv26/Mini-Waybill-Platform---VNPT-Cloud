apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipper-service
  namespace: waybill
  labels:
    app: shipper-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipper-service
  template:
    metadata:
      labels:
        app: shipper-service
    spec:
      containers:
        - name: shipper-service
          image: khanhnv26/shipper-service:4a6ff24b5a9e31fb29fe466e758894b4faec857f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx200m -XX:+UseSerialGC"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:sqlserver://sqlserver-replica:1433;databaseName=shipper_db;encrypt=true;trustServerCertificate=true;"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-peer1:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_INSTANCE_ID
              value: "${HOSTNAME}:${server.port}"
          resources:
            requests:
              memory: "128Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: shipper-service
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: shipper-service
  ports:
    - port: 8089
      targetPort: 8089
