apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipper-service
  namespace: waybill
  labels:
    app: shipper-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipper-service
  template:
    metadata:
      labels:
        app: shipper-service
    spec:
      containers:
        - name: shipper-service
          image: khanhnv26/shipper-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:sqlserver://sqlserver-replica:1433;databaseName=shipper_db;encrypt=true;trustServerCertificate=true;"
            - name: SPRING_DATASOURCE_USERNAME
              value: "sa"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "Replica@123456"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-peer1:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: shipper-service
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: shipper-service
  ports:
    - port: 8089
      targetPort: 8089
