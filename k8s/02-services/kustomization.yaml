apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waybill
resources:
  - api-gateway.yaml
  - audit-service.yaml
  - auth-service.yaml
  - customer-service.yaml
  - frontend.yaml
  - hpa-rules.yaml
  - notification-service.yaml
  - payment-service.yaml
  - rating-service.yaml
  - report-service.yaml
  - routing-service.yaml
  - shipment-service.yaml
  - shipper-service.yaml
  - support-service.yaml
  - tracking-service.yaml
  - waybill-config.yaml
  - waybill-ingress.yaml
  - backend-network-policy.yaml
patches:
  - target:
      kind: Deployment
      labelSelector: app in (api-gateway,audit-service,auth-service,customer-service,frontend,notification-service,payment-service,rating-service,report-service,routing-service,shipment-service,shipper-service,support-service,tracking-service)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: http
          periodSeconds: 15
          failureThreshold: 3
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          failureThreshold: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
