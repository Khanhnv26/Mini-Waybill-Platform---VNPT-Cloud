apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waybill-ingress
  namespace: waybill
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    # 1. Tên miền chính cho giao diện Web Frontend: http://waybill.local
    - host: waybill.local
      http:
        paths:
          # Chuyển hướng trực tiếp API về Gateway nếu gọi qua /api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # Toàn bộ giao diện tĩnh, HTML, JS, CSS về Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # 2. Tên miền riêng cho API Gateway: http://api.waybill.local
    - host: api.waybill.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
                service:
                  name: api-gateway
                port:
                  number: 8080

    # 3. Public read-only access for MinIO objects
    - host: storage.waybill.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
