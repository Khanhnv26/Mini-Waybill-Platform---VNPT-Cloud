apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waybill
resources:
  - 02-services
  - 00-namespaces/00-namespace.yaml
  - 01-infrastructure/eureka.yaml
  - 01-infrastructure/kafka.yaml
  - 01-infrastructure/minio.yaml
  - 01-infrastructure/rabbitmq.yaml
  - 01-infrastructure/redis.yaml
  - 01-infrastructure/sqlserver.yaml
  - 01-infrastructure/sqlserver-init-job.yaml
images:
  - name: khanhnv26/service-registry
    newTag: minikube
  - name: khanhnv26/api-gateway
    newTag: minikube
  - name: khanhnv26/audit-service
    newTag: minikube
  - name: khanhnv26/auth-service
    newTag: minikube
  - name: khanhnv26/customer-service
    newTag: minikube
  - name: khanhnv26/frontend
    newTag: minikube
  - name: khanhnv26/notification-service
    newTag: minikube
  - name: khanhnv26/payment-service
    newTag: minikube
  - name: khanhnv26/rating-service
    newTag: minikube
  - name: khanhnv26/report-service
    newTag: minikube
  - name: khanhnv26/routing-service
    newTag: minikube
  - name: khanhnv26/shipment-service
    newTag: minikube
  - name: khanhnv26/shipper-service
    newTag: minikube
  - name: khanhnv26/support-service
    newTag: minikube
  - name: khanhnv26/tracking-service
    newTag: minikube
patches:
  - target:
      kind: Deployment
      name: eureka-peer1
      namespace: waybill
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Service
      name: (api-gateway|frontend|redis|sqlserver-replica)
      namespace: waybill
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP

  - target:
      kind: Deployment
      name: (frontend|api-gateway)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
