apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-peer1
  namespace: waybill
  labels:
    app: eureka-peer1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-peer1
  template:
    metadata:
      labels:
        app: eureka-peer1
    spec:
      containers:
      - name: eureka
        image: khanhnv26/service-registry:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8761
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          failureThreshold: 6
        env:
          - name: SERVER_PORT
            value: "8761"
          - name: EUREKA_INSTANCE_HOSTNAME
            value: "eureka-peer1"
          - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
            value: "false"
          - name: EUREKA_CLIENT_FETCH_REGISTRY
            value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
    name: eureka-peer1
    namespace: waybill
spec:
    type: ClusterIP
    selector:
        app: eureka-peer1
    ports:
        - port: 8761
          targetPort: 8761
