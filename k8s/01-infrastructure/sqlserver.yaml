apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-pvc
  namespace: waybill
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver-replica
  namespace: waybill
  labels:
    app: sqlserver-replica
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver-replica
  template:
    metadata:
      labels:
        app: sqlserver-replica
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          securityContext:
            runAsUser: 0
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: waybill-runtime
                  key: db-password
          resources:
            requests:
              memory: "1024Mi"
              cpu: "300m"
            limits:
              memory: "2048Mi"
              cpu: "1500m"
          volumeMounts:
            - name: sqlserver-storage
              mountPath: /var/opt/mssql
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: sqlserver-storage
          persistentVolumeClaim:
            claimName: sqlserver-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-replica
  namespace: waybill
spec:
  type: ClusterIP
  selector:
    app: sqlserver-replica
  ports:
    - name: sql-internal
      port: 1433
      targetPort: 1433
