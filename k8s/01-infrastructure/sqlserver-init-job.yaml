apiVersion: batch/v1
kind: Job
metadata:
  name: sqlserver-init-db
  namespace: waybill
spec:
  template:
    metadata:
      labels:
        app: sqlserver-init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: mcr.microsoft.com/mssql/server:2022-latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for SQL Server to be ready..."
              for attempt in {1..60}; do
                if /opt/mssql-tools18/bin/sqlcmd -S sqlserver-replica -U sa -P "$$SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
                  echo "SQL Server is ready!"
                  break
                fi
                sleep 2
              done

              echo "Creating databases if not exist..."
              DATABASES=("auth_db" "customer_db" "shipment_db" "routing_db" "tracking_db" "notification_db" "audit_db" "shipper_db" "report_db" "support_db" "rating_db" "payment_db")
              for db in "$${DATABASES[@]}"; do
                echo "Checking database: $$db"
                /opt/mssql-tools18/bin/sqlcmd -S sqlserver-replica -U sa -P "$$SA_PASSWORD" -C -b -Q "IF DB_ID(N'$$db') IS NULL CREATE DATABASE [$$db];"
              done
              echo "All databases initialized successfully!"
          env:
            - name: SA_PASSWORD
              value: "Replica@123456"
