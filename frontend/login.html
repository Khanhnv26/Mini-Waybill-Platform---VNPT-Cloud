<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - VNPT Waybill Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        vnpt: {
                            50: '#eef6ff',
                            100: '#d9ecff',
                            200: '#bcdfff',
                            500: '#0066cc',
                            600: '#0055aa',
                            700: '#004488',
                            800: '#00376d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-blue-50/40 to-slate-200">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-300/40 border border-slate-200/80 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-vnpt-500 rounded-2xl text-white font-extrabold flex items-center justify-center mx-auto text-xl shadow-lg shadow-vnpt-500/30">
                VNPT
            </div>
            <div class="flex items-center justify-center space-x-2">
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Waybill Platform</h1>
                <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-vnpt-50 text-vnpt-700 border border-vnpt-200">Cloud</span>
            </div>
            <p class="text-xs text-slate-500 font-medium">Nền tảng quản trị và điều phối vận đơn</p>
        </div>

        <div id="errorAlert" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 font-medium flex items-center space-x-2">
            <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span id="errorMessage"></span>
        </div>

        <div id="successAlert" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-700 font-medium flex items-center space-x-2">
            <svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span id="successMessage"></span>
        </div>

        <div class="flex border-b border-slate-200 text-sm font-semibold">
            <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 pb-2.5 text-center text-vnpt-600 border-b-2 border-vnpt-600 transition-colors">
                Đăng Nhập
            </button>
            <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 pb-2.5 text-center text-slate-400 hover:text-slate-600 transition-colors">
                Đăng Ký
            </button>
        </div>

        <div id="loginFormContainer" class="space-y-4">
            <form id="loginForm" onsubmit="handleEmailLogin(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Địa chỉ Email</label>
                    <input type="email" id="loginEmail" required placeholder="name@company.com" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full py-2.5 px-4 bg-vnpt-600 hover:bg-vnpt-700 text-white text-xs font-bold rounded-xl shadow-md shadow-vnpt-600/20 transition-all flex items-center justify-center">
                    <span>Đăng Nhập</span>
                </button>
            </form>

            <div class="relative flex items-center justify-center py-2">
                <div class="border-t border-slate-200 w-full"></div>
                <span class="bg-white px-3 text-[10px] uppercase tracking-wider text-slate-400 font-mono font-semibold">Hoặc tiếp tục với</span>
            </div>

            <div class="flex flex-col items-center justify-center space-y-2">
                <div id="googleBtn" class="flex justify-center min-h-[44px]"></div>
                <div id="googleLoading" class="hidden flex items-center space-x-2 text-xs font-semibold text-vnpt-600 animate-pulse">
                    <svg class="animate-spin h-4 w-4 text-vnpt-600" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>Đang xác thực với Google...</span>
                </div>
            </div>
        </div>

        <div id="registerFormContainer" class="hidden space-y-4">
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Họ và tên</label>
                    <input type="text" id="regFullName" required placeholder="Nguyễn Văn A" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Địa chỉ Email</label>
                    <input type="email" id="regEmail" required placeholder="name@company.com" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" id="regPassword" required placeholder="Tối thiểu 6 ký tự" minlength="6" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Xác nhận mật khẩu</label>
                    <input type="password" id="regConfirmPassword" required placeholder="Nhập lại mật khẩu" minlength="6" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-vnpt-500/20 focus:border-vnpt-500 transition-all"/>
                </div>
                <button type="submit" id="regSubmitBtn" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center">
                    <span>Đăng Ký Tài Khoản</span>
                </button>
            </form>
        </div>

        <div class="text-center pt-2">
            <a href="/index.html" class="text-xs font-semibold text-vnpt-600 hover:text-vnpt-800 hover:underline inline-flex items-center space-x-1 transition-colors">
                <span>← Quay lại trang tra cứu vận đơn</span>
            </a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>

    <script>
        if (Auth.isAuthenticated()) {
            window.location.href = '/index.html';
        }

        const GOOGLE_CLIENT_ID = "530674460360-7q1qf5lchbkj7sp7kslvttf7mqt92klg.apps.googleusercontent.com";

        window.onload = function () {
            if (typeof google === 'undefined') {
                showError("Không thể tải Google Identity Services SDK.");
                return;
            }

            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleLoginResponse,
                auto_select: false
            });

            google.accounts.id.renderButton(
                document.getElementById("googleBtn"),
                {
                    theme: "filled_blue",
                    size: "large",
                    text: "signin_with",
                    shape: "pill",
                    width: 280,
                    logo_alignment: "left"
                }
            );
        };

        function switchAuthTab(tab) {
            clearAlerts();
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const loginFormContainer = document.getElementById('loginFormContainer');
            const registerFormContainer = document.getElementById('registerFormContainer');

            if (tab === 'login') {
                tabLoginBtn.className = "flex-1 pb-2.5 text-center text-vnpt-600 border-b-2 border-vnpt-600 transition-colors";
                tabRegisterBtn.className = "flex-1 pb-2.5 text-center text-slate-400 hover:text-slate-600 transition-colors";
                loginFormContainer.classList.remove('hidden');
                registerFormContainer.classList.add('hidden');
            } else {
                tabRegisterBtn.className = "flex-1 pb-2.5 text-center text-vnpt-600 border-b-2 border-vnpt-600 transition-colors";
                tabLoginBtn.className = "flex-1 pb-2.5 text-center text-slate-400 hover:text-slate-600 transition-colors";
                registerFormContainer.classList.remove('hidden');
                loginFormContainer.classList.add('hidden');
            }
        }

        async function handleEmailLogin(e) {
            e.preventDefault();
            clearAlerts();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('loginSubmitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang đăng nhập...</span>';

            try {
                const response = await Api.post('/api/auth/login', { email, password });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Đăng nhập không thành công!');
                }

                Auth.setSession(data.accessToken, data.user);
                redirectToTarget();
            } catch (err) {
                showError(err.message || 'Đăng nhập thất bại!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng Nhập</span>';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearAlerts();

            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const submitBtn = document.getElementById('regSubmitBtn');

            if (password !== confirmPassword) {
                showError("Mật khẩu xác nhận không khớp!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xử lý...</span>';

            try {
                const response = await Api.post('/api/auth/register', { fullName, email, password });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Đăng ký tài khoản thất bại!');
                }

                Auth.setSession(data.accessToken, data.user);
                redirectToTarget();
            } catch (err) {
                showError(err.message || 'Đăng ký thất bại!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng Ký Tài Khoản</span>';
            }
        }

        async function handleGoogleLoginResponse(googleResponse) {
            clearAlerts();
            const googleLoading = document.getElementById('googleLoading');
            googleLoading.classList.remove('hidden');

            try {
                const response = await Api.post('/api/auth/google', {
                    idToken: googleResponse.credential
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Xác thực tài khoản Google thất bại!');
                }

                Auth.setSession(data.accessToken, data.user);
                redirectToTarget();
            } catch (err) {
                showError(err.message || 'Lỗi đăng nhập Google!');
            } finally {
                googleLoading.classList.add('hidden');
            }
        }

        function redirectToTarget() {
            const redirectUrl = sessionStorage.getItem('redirectAfterLogin') || '/index.html';
            sessionStorage.removeItem('redirectAfterLogin');
            window.location.href = redirectUrl;
        }

        function showError(msg) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = msg;
            errorAlert.classList.remove('hidden');
        }

        function clearAlerts() {
            document.getElementById('errorAlert').classList.add('hidden');
            document.getElementById('successAlert').classList.add('hidden');
        }
    </script>
</body>
</html>
