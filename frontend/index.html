<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#f8fafc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        vnpt: {
                            50: '#eef6ff',
                            100: '#d9ecff',
                            200: '#bcdfff',
                            500: '#0066cc',
                            600: '#0055bb',
                            700: '#004488',
                            800: '#003366',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/style.css?v=2.6.0" />

    <script>
        (function () {
            try {
                localStorage.removeItem('theme');
                document.documentElement.classList.remove('dark');
            } catch (e) {}
        })();
    </script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 antialiased min-h-full flex flex-col selection:bg-blue-600 selection:text-white font-sans">

    <div id="vnpt-page-preloader" class="fixed inset-0 z-[99999] bg-slate-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center text-center space-y-4 max-w-xs px-4">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-blue-200/50"></div>
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-blue-600 border-r-blue-400 animate-spin" style="animation-duration: 0.9s;"></div>
                <div class="absolute inset-2 rounded-full bg-blue-500/5 blur-sm pointer-events-none"></div>
                <div class="w-12 h-12 rounded-2xl vnpt-gradient text-white flex items-center justify-center shadow-lg shadow-blue-600/25 border border-white/30 select-none z-10">
                    <span class="text-xs sm:text-sm font-black tracking-tight leading-none">VNPT</span>
                </div>
            </div>
            <div class="space-y-0.5 pt-1">
                <div class="font-extrabold text-base text-slate-800 tracking-tight">Waybill Post</div>
                <p class="text-[11.5px] text-slate-400 font-medium">Hệ Thống Điều Phối Bưu Chính &amp; Vận Đơn</p>
            </div>
            <div class="pt-2 flex items-center justify-center space-x-2 text-xs text-slate-500 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-ping"></span>
                <span id="preloader-status-text">Đang kết nối hệ thống bưu chính...</span>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var preloader = document.getElementById('vnpt-page-preloader');
            var status = document.getElementById('preloader-status-text');
            if (!preloader) return;
            setTimeout(function () {
                if (status) status.innerText = 'Đồng bộ dữ liệu bưu cục...';
            }, 400);
            setTimeout(function () {
                if (status) status.innerText = 'Sẵn sàng khởi động!';
                preloader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(function () {
                    preloader.style.display = 'none';
                }, 300);
            }, 800);
        })();
    </script>

    <div id="app" v-cloak class="w-full min-h-screen bg-slate-50 selection:bg-blue-600 selection:text-white font-sans">
        <component
            :is="currentUser ? 'InternalLayout' : 'PublicLayout'"
            :current-user="currentUser"
            :current-tab="currentTab"
            :current-tab-title="currentTabTitle"
            :current-tracking-code="currentTrackingCode"
            :is-sidebar-collapsed="isSidebarCollapsed"
            :navigation-tabs="navigationTabs"
            :public-guest-tabs="publicGuestTabs"
            :show-notification-dropdown="showNotificationDropdown"
            :notifications="notifications"
            :unread-notifications-count="unreadNotificationsCount"
            @toggle-sidebar="toggleSidebarCollapse"
            @switch-tab="switchTab"
            @logo-click="handleLogoClick"
            @open-profile="openUserProfileModal"
            @logout="handleLogout"
            @toggle-notifications="toggleNotificationDropdown"
            @mark-all-read="markAllNotificationsAsRead"
            @notification-click="handleNotificationClick"
            @guest-tab-click="handleGuestTabClick"
        >
            <transition name="page" mode="out-in" appear>
                <keep-alive>
                    <component 
                        :is="activeComponent" 
                        :key="currentTab"
                        :current-user="currentUser"
                        :tracking-code="currentTrackingCode"
                        :previous-tab="previousTab"
                        :customer-prefill="selectedCustomerForShipment"
                        :tariff-prefill="selectedTariffForShipment"
                        :feature-id="currentFeatureId"
                        :error-code="currentErrorCode"
                        :custom-title="currentErrorTitle"
                        :custom-message="currentErrorMessage"
                        @back-home="handleBackToHome"
                        @view-tracking="handleViewTracking"
                        @back-previous="handleBackToPreviousTab"
                        @created-shipment="handleShipmentCreated"
                        @create-shipment-for="handleCreateShipmentFor"
                        @create-shipment-from-tariff="handleCreateShipmentFromTariff"
                        @user-updated="handleUserUpdated"
                        @switch-tab="switchTab"
                    ></component>
                </keep-alive>
            </transition>
        </component>

        <toast-container :toast="toast"></toast-container>

        <user-profile-modal
            :show="showUserProfileModal"
            :current-user="currentUser"
            :user-profile="userProfile"
            :is-staff-user="isStaffUser"
            :is-loading="isLoadingUserProfile"
            :is-saving="isSavingUserProfile"
            :is-linking-google="isLinkingGoogle"
            :profile-form-data="profileFormData"
            :get-role-title="getRoleTitle"
            @close="closeUserProfileModal"
            @save="saveUserProfile"
            @trigger-google-link="triggerGoogleLink"
        ></user-profile-modal>

        <chatbot-widget v-if="!isStaffUser"></chatbot-widget>
    </div>

    <script src="js/auth.js"></script>
