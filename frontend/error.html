<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#f8fafc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Hệ Thống - Waybill Platform</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        vnpt: {
                            50: '#eef6ff',
                            100: '#d9ecff',
                            200: '#bcdfff',
                            500: '#0066cc',
                            600: '#0055bb',
                            700: '#004488',
                            800: '#003366',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/style.css?v=3.7.12" />

    <script>
        (function () {
            try {
                localStorage.removeItem('waybill_theme');
                localStorage.removeItem('theme');
                document.documentElement.classList.remove('dark');
            } catch (e) {}
        })();
    </script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 antialiased min-h-full flex flex-col selection:bg-blue-600 selection:text-white font-sans">

    <!-- ==========================================================================
         MÀN HÌNH LOADING RIÊNG TOÀN TRANG (WAYBILL POST FULL-SCREEN PRELOADER)
         ========================================================================== -->
    <div id="waybill-preloader" hidden role="status" aria-label="Đang khởi động hệ thống"></div>
    <script src="js/components/preloader.js?v=3.7.12"></script>

    <div id="app" v-cloak class="w-full min-h-screen bg-slate-50 selection:bg-blue-600 selection:text-white font-sans">
        <component
            :is="currentUser ? 'InternalLayout' : 'PublicLayout'"
            :current-user="currentUser"
            :current-tab="currentTab"
            :current-tab-title="currentTabTitle"
            :current-tracking-code="currentTrackingCode"
            :is-sidebar-collapsed="isSidebarCollapsed"
            :navigation-tabs="navigationTabs"
            :public-guest-tabs="publicGuestTabs"
            :show-notification-dropdown="showNotificationDropdown"
            :notifications="notifications"
            :unread-notifications-count="unreadNotificationsCount"
            @toggle-sidebar="toggleSidebarCollapse"
            @switch-tab="switchTab"
            @logo-click="handleLogoClick"
            @open-profile="openUserProfileModal"
            @logout="handleLogout"
            @toggle-notifications="toggleNotificationDropdown"
            @mark-all-read="markAllNotificationsAsRead"
            @notification-click="handleNotificationClick"
            @guest-tab-click="handleGuestTabClick"
        >
            <transition name="page" mode="out-in" appear>
                <keep-alive>
                    <component 
                        :is="activeComponent" 
                        :key="currentTab"
                        :current-user="currentUser"
                        :tracking-code="currentTrackingCode"
                        :previous-tab="previousTab"
                        :customer-prefill="selectedCustomerForShipment"
                        :tariff-prefill="selectedTariffForShipment"
                        :feature-id="currentFeatureId"
                        :error-code="currentErrorCode"
                        :custom-title="currentErrorTitle"
                        :custom-message="currentErrorMessage"
                        @back-home="handleBackToHome"
                        @view-tracking="handleViewTracking"
                        @back-previous="handleBackToPreviousTab"
                        @created-shipment="handleShipmentCreated"
                        @create-shipment-for="handleCreateShipmentFor"
                        @create-shipment-from-tariff="handleCreateShipmentFromTariff"
                        @user-updated="handleUserUpdated"
                        @switch-tab="switchTab"
                    ></component>
                </keep-alive>
            </transition>
        </component>

        <toast-container :toast="toast"></toast-container>

        <user-profile-modal
            :show="showUserProfileModal"
            :current-user="currentUser"
            :user-profile="userProfile"
            :is-staff-user="isStaffUser"
            :is-loading="isLoadingUserProfile"
            :is-saving="isSavingUserProfile"
            :is-linking-google="isLinkingGoogle"
            :profile-form-data="profileFormData"
            :get-role-title="getRoleTitle"
            @close="closeUserProfileModal"
            @save="saveUserProfile"
            @trigger-google-link="triggerGoogleLink"
        ></user-profile-modal>

        <chatbot-widget v-if="!isStaffUser"></chatbot-widget>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>

    <script src="js/services/routingService.js"></script>
    <script src="js/services/shipmentService.js"></script>
    <script src="js/services/trackingService.js"></script>
    <script src="js/services/customerService.js"></script>
    <script src="js/services/notificationService.js"></script>
    <script src="js/services/auditService.js"></script>
    <script src="js/services/adminService.js"></script>
    <script src="js/services/reportService.js"></script>
    <script src="js/services/pricingService.js"></script>
    <script src="js/services/supportService.js"></script>
    <script src="js/services/shipperService.js"></script>
    <script src="js/services/ratingService.js"></script>

    <script src="js/components/layout/AppSidebar.js"></script>
    <script src="js/components/layout/AppTopbar.js"></script>
    <script src="js/components/layout/InternalFooter.js"></script>
    <script src="js/components/layout/PublicHeader.js"></script>
    <script src="js/components/layout/PublicFooter.js"></script>
    <script src="js/components/common/ToastContainer.js"></script>
    <script src="js/components/common/UserProfileModal.js"></script>
    <script src="js/layouts/InternalLayout.js"></script>
    <script src="js/layouts/PublicLayout.js"></script>

    <script src="js/views/TrackingView.js"></script>
    <script src="js/views/ShipmentView.js"></script>
    <script src="js/views/PostOfficeOpsView.js"></script>
    <script src="js/views/TripsView.js"></script>
    <script src="js/views/HubOpsView.js"></script>
    <script src="js/views/ShipperView.js"></script>
    <script src="js/views/ShipperDirectoryView.js"></script>
    <script src="js/views/CustomerView.js"></script>
    <script src="js/views/AdminRbacView.js"></script>
    <script src="js/views/ReportView.js"></script>
    <script src="js/views/TariffCalculatorView.js"></script>
    <script src="js/views/NetworkView.js"></script>
    <script src="js/views/GuideView.js"></script>
    <script src="js/views/SupportView.js"></script>
    <script src="js/views/UnderDevelopmentView.js"></script>
    <script src="js/views/ErrorView.js?v=2.6.0"></script>
    <script src="js/views/ProfileView.js?v=2.6.0"></script>
    <script src="js/components/ChatbotWidget.js?v=2.6.1"></script>

    <script type="module" src="js/app.js?v=3.8.0"></script>
</body>
</html>
