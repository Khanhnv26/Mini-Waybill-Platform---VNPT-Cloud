spring.application.name=support-service
server.port=8093


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=support_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=sa


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true


# LLM Configuration (Mặc định dùng Ollama Local, có thể ghi đè sang Gemini qua biến môi trường)
spring.ai.openai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
spring.ai.openai.api-key=${AI_API_KEY:${GEMINI_API_KEY:ollama}}
spring.ai.openai.chat.options.model=${AI_MODEL:${GEMINI_MODEL:qwen2.5:7b}}
spring.ai.openai.chat.options.temperature=0.2


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial Support Database